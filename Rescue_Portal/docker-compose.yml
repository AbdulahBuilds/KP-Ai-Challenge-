services:
  redis:
    image: redis:7-alpine
    container_name: rescue-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rescue_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: rescue-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rescue-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rescue_miniodata:/data
    profiles: ["storage"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rescue-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Default is development so clearly-labelled mock integrations can run.
      # For a real deployment set NODE_ENV=production, use live adapters and
      # strong secrets; production rejects mock hospital data by default.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your MongoDB Atlas connection string}
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      HOSPITAL_ADAPTER: ${HOSPITAL_ADAPTER:-mock}
      HOSPITAL_API_BASE_URL: ${HOSPITAL_API_BASE_URL:-}
      HOSPITAL_API_KEY: ${HOSPITAL_API_KEY:-}
      HOSPITAL_DATA_MAX_AGE_SECONDS: ${HOSPITAL_DATA_MAX_AGE_SECONDS:-300}
      HOSPITAL_REQUEST_TIMEOUT_SECONDS: ${HOSPITAL_REQUEST_TIMEOUT_SECONDS:-120}
      MOCK_HOSPITAL_API_KEY: ${MOCK_HOSPITAL_API_KEY:-}
      PATIENT_ADAPTER: ${PATIENT_ADAPTER:-mock}
      PATIENT_API_BASE_URL: ${PATIENT_API_BASE_URL:-}
      PATIENT_API_KEY: ${PATIENT_API_KEY:-}
      MAPS_ADAPTER: ${MAPS_ADAPTER:-mock-haversine}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      AI_ADAPTER: ${AI_ADAPTER:-heuristic}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-rescue-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-5000}
      HOSPITAL_POLL_INTERVAL_MS: ${HOSPITAL_POLL_INTERVAL_MS:-15000}
      LOCATION_RETENTION_DAYS: ${LOCATION_RETENTION_DAYS:-30}
      WORKERS_ENABLED: ${WORKERS_ENABLED:-true}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      EXPOSE_DEV_TOKENS: ${EXPOSE_DEV_TOKENS:-false}
    ports:
      - "4000:4000"
    volumes:
      - rescue_uploads:/app/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        API_PROXY_URL: ${API_PROXY_URL:-http://api:4000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
    container_name: rescue-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      API_PROXY_URL: ${API_PROXY_URL:-http://api:4000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
    ports:
      - "3000:3000"

volumes:
  rescue_redisdata:
  rescue_miniodata:
  rescue_uploads:
